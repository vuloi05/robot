# Hợp nhất cảm biến Encoder (/wheel_odom) + IMU (/imu/data) bằng EKF 2D
# Phát duy nhất TF: odom -> base_footprint và topic /odom
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    debug: false
    publish_acceleration: false
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel Odometry từ diff_drive_controller (enable_odom_tf: false)
    # Chỉ lấy vận tốc vx, vy, vyaw để tránh cộng dồn xung đột vị trí với IMU
    odom0: /wheel_odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # IMU 6 trục tại tâm quay xe: fuse vận tốc góc vyaw (giảm trôi yaw khi trượt bánh)
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
