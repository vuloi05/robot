# Cấu hình 2 lớp mặt nạ Costmap Filters cho Nav2 Jazzy:
#   1. KeepoutFilter (type: 0) -> khóa bếp nóng & sau quầy lễ tân
#   2. SpeedFilter   (type: 1) -> giảm còn 50% tốc độ qua cửa bếp hẹp

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "/keepout_filter_mask"

keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 0
    filter_info_topic: "/keepout_costmap_filter_info"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

speed_filter_mask_server:
  ros__parameters:
    use_sim_time: true
    frame_id: "map"
    topic_name: "/speed_filter_mask"

speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: true
    type: 1
    filter_info_topic: "/speed_costmap_filter_info"
    mask_topic: "/speed_filter_mask"
    base: 100.0
    multiplier: -0.5
