services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: restaurant_mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t 'infra/health' -m 'ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

