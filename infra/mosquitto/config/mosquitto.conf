# Cấu hình Mosquitto cho mạng LAN / Phát triển (Local-First)
# Khi triển khai lên VPS có Internet:
#   1. Đổi `allow_anonymous false`
#   2. Bật `password_file /mosquitto/config/passwd`
#   3. Bật `acl_file /mosquitto/config/acl`
#   4. Cấu hình TLS listener 8883 (cafile, certfile, keyfile)

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# MQTT TCP chuẩn
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets (tiện debug hoặc kết nối trực tiếp nếu cần)
listener 9001 0.0.0.0
protocol websockets

# Chế độ phát triển LAN cục bộ
allow_anonymous true
